services:
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: business-geo-analytics:latest
    ports:
      - "8888:8888"
    environment:
      - BGA_DATA_MODE
      - BGA_CONFIG_PATH
    volumes:
      - ./config:/app/config:ro
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw:ro
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: business-geo-analytics:latest
    profiles: ["tools"]
    environment:
      - BGA_DATA_MODE
      - BGA_CONFIG_PATH
    volumes:
      - ./config:/app/config:ro
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw:ro
    command: ["sh", "-c", "pytest -q && python scripts/verify_repo.py"]

  report:
    build:
      context: .
      dockerfile: Dockerfile
    image: business-geo-analytics:latest
    profiles: ["tools"]
    environment:
      - BGA_DATA_MODE
      - BGA_CONFIG_PATH
    volumes:
      - ./config:/app/config:ro
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw:ro
    command:
      [
        "python",
        "-c",
        "from src.config import load_config; from src.report import generate_franchise_report; cfg = load_config(); res = generate_franchise_report(mode=cfg.data_mode, config=cfg); print(res['output_path'])",
      ]
