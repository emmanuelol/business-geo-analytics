[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "business-geo-analytics"
version = "0.1.0"
description = "Spatio-temporal retail analytics, geo-fenced OSINT shock isolation, and linebuster ROI evaluation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2.0,<4.0",
    "numpy>=1.26.0,<3.0",
    "scipy>=1.13.0,<2.0",
    "statsmodels>=0.14.0,<1.0",
    "matplotlib>=3.8.0,<4.0",
    "pyarrow>=15.0.0,<27.0",
    "requests>=2.31.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "nbformat>=5.10.0,<6.0",
    "nbconvert>=7.16.0,<8.0",
    "jupyter>=1.0.0,<2.0",
    "jupyterlab>=4.0.0,<5.0",
    "ipykernel>=6.29.0,<8.0",
    "pytest>=8.0.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
